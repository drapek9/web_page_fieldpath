<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldPath</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/app_logo_rel.png" type="image/x-icon">
</head>
<body>
    <header>
        <a id="delete_option" href="delete_part/index.html">Delete account <img id="delete_icon" src="images/del_user.png" alt=""></a>
    </header>
    <main>
        <img id="main_logo" src="images/Group 36306.png" alt="">
        <p id="app_name">FieldPath</p>
        <h1>Get notified about the app release.</h1>
        <form action="">
            <input type="text" id="email_input" name="email_input_name" placeholder="Enter your e-mail">
            <p id="error_text"></p>
            <input type="submit" value="Notify Me" id="submit_button">
        </form>

        <nav>
            <a href="https://www.instagram.com/fieldpathapp/"><img src="images/instagram_button.png" alt="instagram" class="social_button"></a>
            <a href="https://www.tiktok.com/@fieldpath.app"><img src="images/tiktok_button.png" alt="tiktok" class="social_button" id="tiktok_button"></a>
        </nav>
    </main>

    <script src="script.js"></script>
</body>
</html>
