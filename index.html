<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldPath</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/app_logo_rel.png" type="image/x-icon">
</head>
<body>
    <header>
        <a id="menu_button" href=""><img src="images/menu.png" alt=""></a>
        <div id="root_div_a">
            <div>
                <a style="color: red;" id="delete_option" href="delete_part/index.html">Delete account <img class="icon_root" src="images/del_user_red.png" alt=""></a>
            </div>
            <hr>
            <div>
               <a class="contact_us_option" href="mailto:support@fieldpathapp.com">Support <img class="icon_root" src="images/question_mark.png" alt=""></a> 
            </div>
            <hr>
            <div>
               <a class="contact_us_option" href="https://www.iubenda.com/privacy-policy/53083407">Privacy & Policy</a> 
            </div>
        </div>
        
    </header>
    <main>
        <img id="main_logo" src="images/Group 36306.png" alt="">
        <p id="app_name">FieldPath</p>
        <h1>Get notified about the app release.</h1>
        <form action="">
            <input type="text" id="email_input" name="email_input_name" placeholder="Enter your e-mail">
            <p id="error_text"></p>
            <input type="submit" value="Notify Me" id="submit_button">
        </form>

        <ul>
            <li><a href="https://www.instagram.com/fieldpathapp/"><img src="images/instagram_button.png" alt="instagram" class="social_button"></a></li>
            <li><a href="https://www.tiktok.com/@fieldpath.app"><img src="images/tiktok_button.png" alt="tiktok" class="social_button" id="tiktok_button"></a></li>
        </ul>
    </main>
    <footer>
        <div id="business_text_contact">
            <p>Partner with us:</p>
            <a href="mailto:business@fieldpathapp.com">business@fieldpathapp.com</a>
        </div>
        
    </footer>

    <script src="script.js"></script>
</body>
</html>
